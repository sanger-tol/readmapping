# yaml-language-server: $schema=https://raw.githubusercontent.com/sanger-tol/nf-core-modules/main/subworkflows/yaml-schema.json
name: "cram_map_illumina_rna"
description: |
  Maps RNA-seq reads in unaligned CRAM format to a set of references.
keywords:
  - rna 
  - align
  - bam
components:
  - cramalign/gencramchunks
  - cramalign/staralignrnaseq
  - bam_samtools_merge_markdup
  - samtools/index:
      git_remote: https://github.com/nf-core/modules.git
  - samtools/splitheader:
      git_remote: https://github.com/nf-core/modules.git
  - star/genomegenerate:
      git_remote: https://github.com/nf-core/modules.git
  - star/align: 
      git_remote: https://github.com/nf-core/modules.git

input:
  - ch_assemblies:
      type: file
      description: |
        Input channel containing assemblies to align Hi-C reads to
        Structure: [ val(meta), path(fasta) ]
      pattern: "*.fn?a(sta)?(.gz)?"
  - ch_rna_cram:
      type: file
      description: |
        Input channel containing RNA-seq CRAM files for mapping.
        Structure: [ val(meta), path(cram) ] or [ val(meta), [ path(cram1), path(cram2), ... ] ]
      pattern: "*.cram"
  - val_aligner:
      type: string
      description: Which aligner to use - star
  - val_cram_chunk_size:
      type: integer
      description: Size of chunk to split CRAM files into
  - val_mark_duplicates:
      type: boolean
      description: Whether to mark duplicates on the merged BAM or not
output:
  - bam:
      type: file
      description: |
        Channel containing the BAM files describing RNA-seq alignments to the input assemblies
        Structure: [ val(meta), path(bam) ]
      pattern: "*.bam"
  - bam_index:
      type: file
      description: |
        Channel containing the indexes for the output BAM
        Structure: [ val(meta), path(bam) ]
      pattern: "*.{bai,csi,crai}"
authors:
  - "@tbrown91"
maintainers:
  - "@tbrown91"
